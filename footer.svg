<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Wave 1 (Back) Gradient -->
    <linearGradient id="waveBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </linearGradient>

    <!-- Wave 2 (Middle) Gradient -->
    <linearGradient id="waveMidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.7"/> <!-- Very dark indigo/blue -->
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </linearGradient>

    <!-- Wave 3 (Front) Gradient -->
    <linearGradient id="waveFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="140" fill="url(#bgGrad)"/>

  <!-- Wave 1 (Back) -->
  <path d="M 0 60 Q 75 45 150 60 T 300 60 T 450 60 T 600 60 T 750 60 T 900 60 T 1050 60 T 1200 60 T 1350 60 T 1500 60 T 1650 60 T 1800 60 L 1800 140 L 0 140 Z" fill="url(#waveBackGrad)" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3" opacity="0.5">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      from="0 0" 
      to="-600 0" 
      dur="20s" 
      repeatCount="indefinite" 
    />
  </path>

  <!-- Wave 2 (Middle) -->
  <path d="M 0 75 Q 90 60 180 75 T 360 75 T 540 75 T 720 75 T 900 75 T 1080 75 T 1260 75 T 1440 75 T 1620 75 T 1800 75 T 1980 75 T 2160 75 L 2160 140 L 0 140 Z" fill="url(#waveMidGrad)" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.4" opacity="0.6">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      from="0 0" 
      to="-720 0" 
      dur="15s" 
      repeatCount="indefinite" 
    />
  </path>

  <!-- Wave 3 (Front) -->
  <path d="M 0 90 Q 60 75 120 90 T 240 90 T 360 90 T 480 90 T 600 90 T 720 90 T 840 90 T 960 90 T 1080 90 T 1200 90 T 1320 90 T 1440 90 T 1560 90 T 1680 90 T 1800 90 L 1800 140 L 0 140 Z" fill="url(#waveFrontGrad)" stroke="#475569" stroke-width="0.5" stroke-opacity="0.5" opacity="0.95">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      from="0 0" 
      to="-480 0" 
      dur="10s" 
      repeatCount="indefinite" 
    />
  </path>

</svg>
